[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "framebfn"
version = "0.1.0"
description = "Utilities and Colab workflows for peptide conformational data used by FrameBFN."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.19",
  "huggingface-hub>=0.23",
  "matplotlib>=3.8",
  "mdtraj>=1.10",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

